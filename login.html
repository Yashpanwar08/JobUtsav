<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff7b00, #ffb347, #ffffff);
      padding: 20px;
    }
    .login-container{
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      animation: fadeIn 1s ease;
    }
    .login-container h2{
      color: #ff7b00;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .login-container p{
      color: #666;
      margin-bottom: 30px;
      font-size: 15px;
    }
    .input-box{
      position: relative;
      margin-bottom: 25px;
    }
    .input-box input{
      width: 100%;
      padding: 15px;
      border: 2px solid #ffd2a6;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
      transition: 0.3s;
      background: #fff;
    }
    .input-box input:focus{
      border-color: #ff7b00;
      box-shadow: 0 0 10px rgba(255,123,0,0.3);
    }
    .login-btn{
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(to right, #ff7b00, #ff9900);
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }
    .login-btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255,123,0,0.4);
    }
    .extra-links{
      margin-top: 20px;
      font-size: 14px;
    }
    .extra-links a{
      color: #ff7b00;
      text-decoration: none;
      font-weight: bold;
    }
    .extra-links a:hover{
      text-decoration: underline;
    }
    @keyframes fadeIn{
      from{
        opacity: 0;
        transform: translateY(30px);
      }
      to{
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* Responsive Design */
    @media(max-width: 768px){
      .login-container{
        padding: 35px 25px;
      }
      .login-container h2{
        font-size: 28px;
      }
    }
    @media(max-width: 480px){
      .login-container{
        padding: 30px 20px;
        border-radius: 15px;
      }
      .login-container h2{
        font-size: 24px;
      }
      .input-box input{
        padding: 13px;
        font-size: 15px;
      }
      .login-btn{
        padding: 13px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <p>Welcome Back! Please login to continue.</p>
    <form action="login.php" method="POST">
      <div class="input-box">
        <input type="email" name="email" placeholder="Admin Email" required>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <div class="extra-links">
      <p><a href="#">Forgot Password?</a></p>
    </div>
  </div>
</body>
</html>
